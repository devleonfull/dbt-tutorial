sources:
  - name: jaffle_shop
    schema: jaffle_shop
    database: raw
    tables:
      - name: customers
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
            
      - name: orders
        columns: 
          - name: id
            data_tests:
               - unique
               - not_null
        config:
          freshness:
            warn_after:
              count: 7
              period: day
            error_after:
              count: 14
              period: day
            loaded_at_field: _etl_loaded_at


